# Production configuration — used by the Docker image (see packages/backend/Dockerfile CMD).
# All values are env-driven; secrets are injected by Portainer per-stack env vars, never committed.

app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  # Set to the browser-facing URL via the BACKSTAGE_APP_URL env var
  # (dev: https://192.168.1.30:7007, core: https://backstage.homelab.lan via Traefik TLS).
  baseUrl: ${BACKSTAGE_APP_URL:-http://localhost:7007}

backend:
  baseUrl: ${BACKSTAGE_APP_URL:-http://localhost:7007}

  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # NOTE: `backend.https` is intentionally NOT set here.
  # Backstage's readHttpsOptions accepts `true` (self-signed cert) or an object
  # (pem cert) — plain HTTP means the key must be ABSENT. `https: false` crashes
  # with "got boolean, wanted object". The Dockerfile CMD loads exactly one of:
  #   app-config.https.yaml    (https: true  -> self-signed) when BACKSTAGE_HTTPS unset (dev)
  #   app-config.traefik.yaml  (https absent -> plain HTTP)  when BACKSTAGE_HTTPS set (core)

  # Serve over plain HTTP on the LAN. Backstage's default CSP (from Helmet) includes
  # `upgrade-insecure-requests`, which rewrites every http:// subresource to https:// —
  # with no TLS listener all JS/CSS fail with ERR_SSL_PROTOCOL_ERROR and the portal shows
  # a blank page. Set it to `false` to remove that directive (see applyCspDirectives).
  csp:
    upgrade-insecure-requests: false
    connect-src: ["'self'", 'http:', 'https:']

  # Postgres on docker-data-01 (192.168.1.32:5432). Shared `homelab` server; the
  # `backstage` database + user are created once (see stacks/backstage/README.md).
  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST:-192.168.1.32}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

  # External access for the MCP actions endpoint (AI assistants). The client
  # calls /api/mcp-actions/v1 with `Authorization: Bearer <BACKSTAGE_MCP_TOKEN>`.
  # Token is injected via Portainer env; never committed.
  auth:
    externalAccess:
      - type: static
        options:
          token: ${BACKSTAGE_MCP_TOKEN}
          subject: mcp-clients
        accessRestrictions:
          - plugin: mcp-actions
          - plugin: catalog

# TechDocs publishes to MinIO (S3-compatible) on docker-data-01 (minio:9000,
# homelab network). Generator still runs in Docker via the mounted socket.
techdocs:
  publisher:
    type: awsS3
    awsS3:
      bucketName: backstage-techdocs
      endpoint: http://minio:9000
      s3ForcePathStyle: true
      credentials:
        accessKeyId: ${MINIO_ROOT_USER}
        secretAccessKey: ${MINIO_ROOT_PASSWORD}

auth:
  # GitHub SSO — the only sign-in provider. clientId/Secret are injected via
  # Portainer env vars. `usernameMatchingUserEntityName` maps the GitHub login
  # to a catalog User entity (homelab-workloads/org.yaml -> User "troyygan").
  providers:
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName

catalog:
  # Explicit URL locations — `troyygan` is a personal GitHub account, so org
  # discovery doesn't apply; each repo exposes its own catalog-info.yaml.
  # Token-based fetches come from the `integrations.github` token in app-config.yaml.
  locations:
    - type: url
      target: https://github.com/troyygan/homelab-workloads/blob/main/catalog-info.yaml

    - type: url
      target: https://github.com/troyygan/homelab-workloads/blob/main/org.yaml
      rules:
        - allow: [User, Group]

    - type: url
      target: https://github.com/troyygan/homelab-platform/blob/main/catalog-info.yaml

    - type: url
      target: https://github.com/troyygan/backstage-app/blob/main/catalog-info.yaml

    - type: url
      target: https://github.com/troyygan/backstage-app/blob/main/templates/homelab-service/template.yaml
      rules:
        - allow: [Template]

# Production configuration — used by the Docker image (see packages/backend/Dockerfile CMD).
# All values are env-driven; secrets are injected by Portainer per-stack env vars, never committed.

app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  # Set to the browser-facing URL via the BACKSTAGE_APP_URL env var
  # (dev: https://192.168.1.30:7007, core: https://backstage.homelab.lan via Traefik TLS).
  baseUrl: ${BACKSTAGE_APP_URL:-http://localhost:7007}

backend:
  baseUrl: ${BACKSTAGE_APP_URL:-http://localhost:7007}

  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # Serve HTTPS with Backstage's generated self-signed certificate (dev +
  # direct-port access). On core, Traefik terminates TLS and Backstage serves
  # PLAIN HTTP internally: `--config app-config.traefik.yaml` is appended by the
  # Dockerfile CMD when BACKSTAGE_HTTPS is set, overriding `https` to `false`.
  # (A `https: ${VAR:-...}` env substitution does NOT work here — Backstage
  # config substitution is string-based with no boolean coercion, and
  # readHttpsOptions rejects a string: "got string, wanted object".)
  #
  # Without HTTPS (or localhost) the UI errors with
  # "globalThis.crypto.randomUUID is not a function" — secure contexts only.
  https: true

  # Serve over plain HTTP on the LAN. Backstage's default CSP (from Helmet) includes
  # `upgrade-insecure-requests`, which rewrites every http:// subresource to https:// —
  # with no TLS listener all JS/CSS fail with ERR_SSL_PROTOCOL_ERROR and the portal shows
  # a blank page. Set it to `false` to remove that directive (see applyCspDirectives).
  csp:
    upgrade-insecure-requests: false
    connect-src: ["'self'", 'http:', 'https:']

  # Postgres on docker-data-01 (192.168.1.32:5432). Shared `homelab` server; the
  # `backstage` database + user are created once (see stacks/backstage/README.md).
  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST:-192.168.1.32}
      port: ${POSTGRES_PORT:-5432}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

auth:
  # Guest sign-in for the LAN-only eval portal. `dangerouslyAllowOutsideDevelopment`
  # is REQUIRED: without it, the guest provider refuses to issue tokens when
  # NODE_ENV=production (the Docker image runs in production mode), and the UI
  # shows "You cannot sign in as a guest". GitHub SSO is a future step (the
  # github-provider auth module is already wired in src/index.ts).
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

catalog:
  # Explicit URL locations — `troyygan` is a personal GitHub account, so org
  # discovery doesn't apply; each repo exposes its own catalog-info.yaml.
  # Token-based fetches come from the `integrations.github` token in app-config.yaml.
  locations:
    - type: url
      target: https://github.com/troyygan/homelab-workloads/blob/main/catalog-info.yaml

    - type: url
      target: https://github.com/troyygan/homelab-platform/blob/main/catalog-info.yaml

    - type: url
      target: https://github.com/troyygan/backstage-app/blob/main/catalog-info.yaml

name: Validate, build and deploy Backstage

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Core deployment or optional temporary dev validation
        required: false
        type: choice
        default: core
        options: [core, dev]

permissions:
  contents: read

concurrency:
  group: backstage-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, homelab]
    timeout-minutes: 60
    env:
      RELEASE_APP: backstage
      IMAGE_REPOSITORY: registry.homelab.lan:5000/backstage
      DOCKERFILE: packages/backend/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Docker runs locked Yarn install, TypeScript, unit tests and the bundle
      # build before publishing. The LAN runner already has registry auth.
      - name: Publish or verify the immutable commit image
        id: image
        run: python3 scripts/publish-image.py

      - name: Request deployment to the selected target
        env:
          GH_TOKEN: ${{ secrets.WORKLOADS_DISPATCH_TOKEN }}
          RELEASE_IMAGE: ${{ steps.image.outputs.reference }}
          RELEASE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'core' }}
        run: python3 scripts/request-workload-release.py

# Core / Traefik-specific config — loaded ONLY when BACKSTAGE_HTTPS is set
# (e.g. `false` in the Portainer stack env on core).
#
# On core, Traefik terminates TLS (websecure) and Backstage serves PLAIN HTTP
# internally. Plain HTTP = `backend.https` key ABSENT (readHttpsOptions returns
# undefined). Do NOT set `backend.https: false` here — it is not a valid value
# and crashes with "got boolean, wanted object".
# The Dockerfile CMD loads exactly one of app-config.https.yaml or this file.

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: homelab-service
  title: New Homelab Service
  description: Scaffold a new own-app source repo (Dockerfile + CI + catalog entity) and push it to GitHub
spec:
  owner: user:troyygan
  type: service

  parameters:
    - title: Service
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique kebab-case name (e.g. my-service)
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: One-line description
          default: A homelab service
    - title: Destination
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            defaultOwner: troyygan

  steps:
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.repoUrl | parseRepoUrl | pick('owner') }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

    - id: notify
      name: Notify
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - user:default/troyygan
        title: 'New homelab service scaffolded'
        info: 'Your new service repository has been created'
        severity: normal

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
